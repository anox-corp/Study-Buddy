<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3a3f22" />
<title>Study Buddy</title>

<!--
============================================================
  STUDY BUDDY — ORGANIZED STRUCTURE
============================================================
  This file is divided into clearly labeled sections:

  CSS (in <style>):
    § 1. THEME VARIABLES   ← colors, spacing, radii
    § 2. BASE              ← body, resets
    § 3. TOPBAR            ← header, brand
    § 4. POMODORO          ← timer widget
    § 5. LAYOUT            ← wrapper, step screens
    § 6. CARDS             ← subject & chapter cards
    § 7. BREADCRUMB        ← navigation
    § 8. TABS              ← Notes/MCQ/SQ tabs
    § 9. NOTES             ← note cards, tables, formulas
    § 10. STUDY CARD       ← MCQ & SQ container
    § 11. MCQ OPTIONS      ← answer buttons, feedback
    § 12. SQ ANSWER        ← short question reveal
    § 13. RESULTS          ← score screen
    § 14. WATERMARK
    § 15. RESPONSIVE

  JAVASCRIPT (in <script>):
    § 1. AUDIO             ← chime sounds
    § 2. DATA              ← all questions & notes
    § 3. REGISTRY          ← subjects & chapters
    § 4. POMODORO LOGIC
    § 5. HELPERS           ← utils
    § 6. NAVIGATION        ← step switching
    § 7. RENDERERS         ← MCQ, SQ, chapter view
    § 8. INIT
============================================================
-->

<style>
/* ============================================================
   § 1. THEME VARIABLES — change colors here
   ============================================================ */
:root{
  /* Base */
  --bg:#e8e2cd;
  --surface:#f2ecda;
  --surface-2:#e5dfc8;
  --surface-3:#dcd5b9;

  /* Text */
  --ink:#2c2c1e;
  --ink-soft:#4a4a32;
  --muted:#736d52;

  /* Lines */
  --line:#cfc8ab;
  --line-strong:#b8b090;

  /* Accent (olive) */
  --accent:#6d7c38;
  --accent-hover:#7c8a44;
  --accent-soft:#a3b968;
  --accent-tint:#dde4c4;

  /* Dark (topbar, buttons) */
  --dark:#3a3f22;
  --dark-2:#4a5030;

  /* Feedback */
  --correct:#3d5a24;
  --correct-bg:#e2e9cf;
  --correct-line:#8fa860;
  --incorrect:#8a382a;
  --incorrect-bg:#eed8cc;
  --incorrect-line:#bc8270;

  /* Shape */
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(58,63,34,.05);
  --shadow:0 2px 8px rgba(58,63,34,.07);
  --shadow-lg:0 8px 24px rgba(58,63,34,.1);
}

/* ============================================================
   § 2. BASE — resets and body
   ============================================================ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 100% 0%, rgba(163,185,104,.12), transparent 400px),
    radial-gradient(circle at 0% 100%, rgba(163,185,104,.08), transparent 400px);
  background-attachment:fixed;
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;}

/* ============================================================
   § 3. TOPBAR — header and brand
   ============================================================ */
.topbar{
  background:var(--dark);
  color:#f0ebd8;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 40px;
  gap:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  position:sticky;
  top:0;
  z-index:50;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:13px;letter-spacing:.08em;
  cursor:pointer;user-select:none;color:#f0ebd8;
  padding:6px 8px;border-radius:8px;transition:.15s ease;
}
.brand:hover{background:rgba(255,255,255,.06);}
.brand-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent-soft);
  box-shadow:0 0 8px rgba(163,185,104,.6);
}
.topbar-right{display:flex;align-items:center;gap:14px;}

/* ============================================================
   § 4. POMODORO — timer widget
   ============================================================ */
.pomo{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:11px;padding:5px 10px;
  font-size:12px;color:#f0ebd8;transition:.2s ease;
}
.pomo.running{border-color:var(--accent-soft);background:rgba(163,185,104,.12);}
.pomo.break-mode{border-color:#a3b968;background:rgba(163,185,104,.15);}
.pomo.warning{border-color:#d4a860;background:rgba(212,168,96,.12);}
.pomo.warning .pomo-time{color:#e8b878;}
.pomo-time{
  font-variant-numeric:tabular-nums;font-weight:700;
  font-size:13px;min-width:46px;color:#fff;
}
.pomo-mode{
  font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;opacity:.75;font-weight:700;
}
.pomo button{
  background:transparent;border:1px solid rgba(255,255,255,.18);
  color:#f0ebd8;border-radius:7px;padding:4px 11px;
  font-size:11px;font-weight:600;cursor:pointer;transition:.15s ease;
}
.pomo button:hover{border-color:var(--accent-soft);background:rgba(255,255,255,.05);}
.pomo button.primary{
  background:var(--accent-soft);color:var(--dark);
  border-color:var(--accent-soft);font-weight:700;
}
.pomo button.primary:hover{background:#b5cc80;}
.pomo select{
  background:rgba(255,255,255,.08);color:#f0ebd8;
  border:1px solid rgba(255,255,255,.16);
  border-radius:7px;padding:4px 22px 4px 8px;
  font-size:11px;cursor:pointer;font-weight:600;
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%23d4d0b0' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;background-size:9px;
}
.pomo select option{background:var(--dark);color:#f0ebd8;}

/* ============================================================
   § 5. LAYOUT — main wrapper and step screens
   ============================================================ */
.wrap{
  width:100%;max-width:1200px;
  margin:0 auto;padding:56px 40px 100px;
}
.step-head{text-align:center;margin-bottom:52px;}
.step-eyebrow{
  color:var(--accent);text-transform:uppercase;
  font-size:11px;letter-spacing:.18em;font-weight:800;margin:0 0 14px;
}
.step-title{
  margin:0;font-size:clamp(30px,4vw,42px);
  font-weight:800;letter-spacing:-.04em;line-height:1.15;color:var(--ink);
}
.step-sub{
  color:var(--muted);font-size:15px;
  margin:14px auto 0;max-width:560px;line-height:1.65;
}
.grid{display:grid;gap:20px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}

/* ============================================================
   § 6. CARDS — subject & chapter cards
   ============================================================ */
.card-btn{
  display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:30px;
  cursor:pointer;transition:.2s ease;font-family:inherit;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.card-btn::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 100% 0%, rgba(163,185,104,.14), transparent 60%);
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.card-btn:hover{
  border-color:var(--accent-soft);
  transform:translateY(-3px);
  box-shadow:var(--shadow-lg);
}
.card-btn:hover::before{opacity:1;}
.card-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.card-emoji{font-size:44px;line-height:1;margin-bottom:16px;display:block;}
.card-title{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.card-meta{color:var(--muted);font-size:13.5px;font-weight:500;}
.card-num{
  font-size:11px;text-transform:uppercase;letter-spacing:.14em;
  font-weight:800;color:var(--accent);margin-bottom:12px;
}
.card-desc{color:var(--ink-soft);font-size:14px;line-height:1.65;margin:10px 0 18px;}
.card-stats{
  display:flex;gap:18px;color:var(--muted);font-size:13px;
  font-weight:600;padding-top:16px;border-top:1px solid var(--line);
}
.back{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:0;color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer;
  padding:6px 10px;margin-bottom:22px;border-radius:8px;transition:.15s ease;
}
.back:hover{color:var(--ink);background:var(--surface-2);}
.subject-title{
  font-size:28px;font-weight:800;letter-spacing:-.03em;
  margin:0 0 30px;color:var(--ink);
}

/* ============================================================
   § 7. BREADCRUMB — navigation
   ============================================================ */
.crumbs{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;color:var(--muted);margin-bottom:26px;
}
.crumbs button{
  background:transparent;border:0;padding:3px 8px;
  border-radius:6px;color:var(--accent);font-weight:700;
  cursor:pointer;font-size:13px;transition:.15s ease;
}
.crumbs button:hover{background:var(--surface-2);}
.crumbs .current{color:var(--ink);font-weight:700;}
.crumbs .sep{color:var(--line-strong);font-weight:700;}
.crumbs .spacer{flex:1;}
.crumbs .switch{
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink-soft);padding:7px 15px;border-radius:999px;
  font-size:12px;font-weight:600;cursor:pointer;
  transition:.15s ease;box-shadow:var(--shadow-sm);
}
.crumbs .switch:hover{color:var(--ink);border-color:var(--accent-soft);}

/* ============================================================
   § 8. TABS — Notes/MCQ/SQ switcher
   ============================================================ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px;}
.tab{
  background:transparent;border:0;padding:12px 22px;
  cursor:pointer;font-size:14px;font-weight:700;
  color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:.15s ease;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ============================================================
   § 9. NOTES — note cards, tables, formulas
   ============================================================ */
.notes{display:grid;gap:18px;}
.note{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow-sm);
}
.note h3{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.015em;color:var(--ink);}
.note h4{
  margin:20px 0 8px;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
}
.note p,.note li{font-size:14.5px;line-height:1.8;color:var(--ink-soft);}
.note ul,.note ol{padding-left:24px;margin:12px 0;}
.note li{margin-bottom:5px;}
.term{
  color:var(--accent);font-weight:700;background:var(--accent-tint);
  padding:1px 7px;border-radius:5px;font-size:13px;
}
.formula{
  background:var(--surface-2);border-left:3px solid var(--accent);
  padding:14px 20px;border-radius:0 10px 10px 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.8;margin:14px 0;
  color:var(--ink);overflow-x:auto;
}
table{
  width:100%;border-collapse:collapse;margin:16px 0 4px;
  font-size:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
table th,table td{
  border-bottom:1px solid var(--line);padding:12px 16px;
  text-align:left;line-height:1.6;
}
table th{
  font-weight:800;font-size:12px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);background:var(--surface-2);
}
table tr:last-child td{border-bottom:0;}
table tbody tr:hover td{background:var(--surface-2);}

/* ============================================================
   § 10. STUDY CARD — MCQ & SQ container
   ============================================================ */
.study-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:40px 44px;box-shadow:var(--shadow);
}
.study-top{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:20px;font-size:12.5px;
  color:var(--muted);font-weight:700;
}
.study-top .cat{
  background:var(--accent-tint);padding:6px 14px;border-radius:999px;
  font-size:11.5px;color:var(--accent);font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;
}
.bar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:32px;}
.bar-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));
  width:0;transition:width .3s ease;border-radius:3px;
}
.question{
  font-size:22px;line-height:1.5;letter-spacing:-.015em;
  font-weight:700;margin:0 0 26px;color:var(--ink);
}

/* ============================================================
   § 11. MCQ OPTIONS — answer buttons, feedback
   ============================================================ */
.opts{display:grid;gap:10px;}
.opt{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:var(--surface-2);border:1px solid transparent;
  border-radius:12px;cursor:pointer;text-align:left;
  font-size:15px;transition:.15s ease;color:var(--ink);font-weight:500;
}
.opt:hover:not(:disabled){border-color:var(--accent-soft);background:var(--surface);}
.opt:disabled{cursor:default;}
.opt .lt{
  flex:0 0 26px;height:26px;border-radius:7px;
  background:var(--surface);display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--muted);
  border:1px solid var(--line);transition:.15s ease;
}
.opt.sel{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent-tint);}
.opt.sel .lt{background:var(--accent);color:#fff;border-color:var(--accent);}
.opt.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt.right .lt{background:var(--correct);color:#fff;border-color:var(--correct);}
.opt.wrong{background:var(--incorrect-bg);border-color:var(--incorrect-line);color:var(--incorrect);}
.opt.wrong .lt{background:var(--incorrect);color:#fff;border-color:var(--incorrect);}
.fb{display:none;margin-top:20px;padding:16px 20px;border-radius:12px;font-size:14px;line-height:1.7;}
.fb.show{display:block;}
.fb.good{background:var(--correct-bg);color:var(--correct);border-left:3px solid var(--correct-line);}
.fb.bad{background:var(--incorrect-bg);color:var(--incorrect);border-left:3px solid var(--incorrect-line);}
.fb strong{display:block;margin-bottom:5px;font-size:14px;font-weight:800;}
.actions{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-top:28px;flex-wrap:wrap;
}
.actions-right{display:flex;gap:10px;margin-left:auto;}
.btn{
  background:var(--dark);color:#f0ebd8;border:0;border-radius:10px;
  padding:11px 20px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s ease;
}
.btn:hover:not(:disabled){background:var(--dark-2);transform:translateY(-1px);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn.accent{background:var(--accent);color:#f0ebd8;}
.btn.accent:hover:not(:disabled){background:var(--accent-hover);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2);}
.hint{font-size:12px;color:var(--muted);font-weight:500;}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.filters .pill{
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.15s ease;box-shadow:var(--shadow-sm);
}
.filters .pill:hover{color:var(--ink);border-color:var(--accent-soft);}
.filters .pill.on{background:var(--dark);color:#f0ebd8;border-color:var(--dark);}
.filters .spacer{flex:1;}
.filters .shuffle{
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:.15s ease;box-shadow:var(--shadow-sm);
}
.filters .shuffle:hover{color:var(--ink);border-color:var(--accent-soft);}

/* ============================================================
   § 12. SQ ANSWER — short question reveal
   ============================================================ */
.sq-answer{
  display:none;margin-top:18px;padding:20px 24px;
  background:var(--surface-2);border-radius:12px;
  border-left:3px solid var(--accent);
  font-size:14.5px;line-height:1.8;color:var(--ink-soft);white-space:pre-wrap;
}
.sq-answer.show{display:block;}

/* ============================================================
   § 13. RESULTS — score screen
   ============================================================ */
.results{
  text-align:center;padding:52px 40px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.results .big{font-size:56px;font-weight:800;letter-spacing:-.045em;margin:0;color:var(--ink);}
.results .big span{color:var(--accent);}
.results .sub{color:var(--muted);font-size:15px;margin:12px 0 30px;font-weight:500;}
.results .row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.missed{text-align:left;margin-top:36px;padding-top:26px;border-top:1px solid var(--line);}
.missed h4{
  margin:0 0 16px;font-size:12px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:800;
}
.missed-item{
  padding:14px 0;border-bottom:1px solid var(--line);
  font-size:14px;line-height:1.6;
}
.missed-item:last-child{border-bottom:0;}
.missed-item strong{display:block;font-weight:700;margin-bottom:4px;color:var(--ink);}
.missed-item span{color:var(--muted);font-size:13px;}

/* ============================================================
   § 14. WATERMARK
   ============================================================ */
.wm{
  position:fixed;bottom:22px;right:26px;z-index:100;
  font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dark);
  padding:9px 18px;border-radius:999px;
  background:rgba(242,236,218,.85);
  border:1px solid var(--line-strong);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:none;user-select:none;
  box-shadow:0 4px 14px rgba(58,63,34,.12);opacity:.9;
}
.wm::before{content:"✦ ";color:var(--accent);font-weight:900;}

.hidden{display:none !important;}

/* ============================================================
   § 15. RESPONSIVE
   ============================================================ */
@media (max-width:1024px){
  .wrap{max-width:820px;padding:48px 32px 90px;}
  .study-card{padding:34px 36px;}
  .note{padding:24px 28px;}
}

@media (max-width:640px){
  .wrap{max-width:100%;padding:32px 18px 70px;}
  .topbar{padding:0 12px;height:58px;font-size:12px;gap:10px;}
  .pomo{gap:6px;padding:4px 8px;}
  .pomo-mode{font-size:9px;}
  .pomo-time{font-size:12px;min-width:40px;}
  .pomo button{padding:4px 8px;font-size:10px;}
  .pomo select{padding:3px 18px 3px 6px;font-size:10px;background-size:8px;}
  .step-title{font-size:26px;}
  .step-sub{font-size:14px;}
  .study-card{padding:22px 20px;}
  .study-top{font-size:11.5px;}
  .question{font-size:18px;}
  .opt{padding:13px 14px;font-size:14px;gap:12px;}
  .opt .lt{flex:0 0 24px;height:24px;font-size:11px;}
  .actions{flex-direction:column;align-items:stretch;}
  .actions-right{justify-content:flex-end;flex-wrap:wrap;}
  .crumbs{font-size:12px;margin-bottom:20px;}
  .crumbs .switch{padding:6px 12px;font-size:11.5px;}
  .tab{padding:10px 14px;font-size:13px;}
  .card-btn{padding:22px;}
  .card-emoji{font-size:34px;margin-bottom:12px;}
  .card-title{font-size:17px;}
  .note{padding:22px 20px;}
  .note h3{font-size:16px;}
  .note p,.note li{font-size:13.5px;}
  .formula{font-size:12.5px;padding:12px 14px;}
  table{font-size:12.5px;}
  table th,table td{padding:10px 12px;}
  .filters .pill,.filters .shuffle{padding:6px 12px;font-size:11.5px;}
  .results{padding:36px 22px;}
  .results .big{font-size:44px;}
  .wm{bottom:14px;right:14px;font-size:10.5px;padding:7px 14px;letter-spacing:.1em;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important;}
}
</style>
</head>

<body>

<!-- ============================================================
     HTML — TOPBAR
     ============================================================ -->
<header class="topbar">
  <div class="brand" id="brand">
    <div class="brand-dot"></div>
    <span>STUDY BUDDY</span>
  </div>
  <div class="topbar-right">
    <div class="pomo" id="pomo">
      <span class="pomo-mode" id="pomoMode">Focus</span>
      <span class="pomo-time" id="pomoTime">25:00</span>
      <select id="pomoSelect" aria-label="Session length">
        <option value="15">15/2</option>
        <option value="25" selected>25/5</option>

/* ============================================================
   JS § 1. AUDIO — chime sounds
   ============================================================ */
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new AudioCtxClass(); }catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}

function playTones(freqs){
  const ctx = ensureAudio();
  if(!ctx) return;
  const now = ctx.currentTime;
  freqs.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const start = now + i * 0.15;
    const dur = 0.75;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.15, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  });
}

const playChime     = () => playTones([880, 1174.66]);
const playWarning   = () => playTones([1318.51]);

{category:"Knowledge",question:"What is nuclear chain reaction?",answer:"When a large atom is hit with a neutron, two new small atoms and two new neutrons form, which goes on like a chain; this process is called a nuclear chain reaction."},
{category:"Knowledge",question:"What is nuclear fission? [D.j.B. 25; D.B. 20]",answer:"The nuclear process in which the nucleus of a larger and heavy element is broken into the nucleus of smaller elements is called nuclear fission."},
{category:"Comprehension",question:"Why don't endothermic reactions occur spontaneously?",answer:"Heat doesn't have to be externally provided in spontaneous reactions. The heat absorbing capacity of product must be lower than the reactants for the reaction to be spontaneous. But in endothermic reactions, the heat absorbing capacity of product is higher than reactants. So, the value of ΔH is positive. Again, heat has to be supplied from outside for this reaction to occur, which is against the condition of spontaneous reaction. So, endothermic reaction doesn't occur spontaneously."},
{category:"Comprehension",question:"What does the positive or negative value of ΔH mean?",answer:"ΔH expresses the change of heat energy in a reaction. ΔH can be calculated by subtracting the total energy evolved from forming new bonds from the total energy required to break old bonds. The value of ΔH positive and negative refers to endothermic and exothermic reaction respectively."},
{category:"Comprehension",question:"Why is heat generated when lime is mixed with water? [D.B. 25; S.B. 17]",answer:"CaO + H₂O → Ca(OH)₂ + Heat. The internal chemical energy within the product is less than the total internal chemical energy present in the reactants. After the total chemical energy of the reactants is consumed, the excess energy is released as heat."},
{category:"Comprehension",question:"Why is ethanol called biofuel? [J.B. 17]",answer:"Ethanol is a combustible liquid chemical. Heat is produced when ethanol is burned. Like mineral fuel, ethanol can be used as heat engine fuel. And this ethanol is an organic chemical compound, which can be produced through fermentation process from different starch type crops such as potato, corn, sugarcane etc."},
{category:"Comprehension",question:"What problem occurs if there is N and S compound in fuel? Explain.",answer:"If S and N compounds are mixed in fuel, then it releases SO₂, SO₃ and NO₂ as byproducts along with CO₂. These byproduct gases cause acid rain which is harmful for the environment."},
{category:"Comprehension",question:"What do you mean by safe fuel?",answer:"The fuels that don't produce any toxic substances for health and environment are called safe fuels. For example — methane and ethanol are safe fuels."},
{category:"Comprehension",question:"What does galvanizing mean? Explain. [D.B. 17]",answer:"The process of zinc plating on a metal is called galvanizing. Metals react with air and water, corrode, and cause economical loss. Galvanizing is a process where metals are plated with zinc metal to prevent metal corrosion."},
{category:"Comprehension",question:"Explain why KCl is an electrolyte. [B.B. 25]",answer:"KCl is an ionic compound. It conducts electricity in a molten or dissolved state and undergoes a chemical change. When electricity is passed through molten KCl, chlorine gas is produced at the anode and potassium ions are formed at the cathode."},
{category:"Comprehension",question:"Electroplating prevents metal corrosion. Explain.",answer:"Electroplating is used to plate less reactive metal on a highly reactive metal. Since less reactive metals don't react with atmospheric oxygen, the highly reactive metals don't corrode as they are not oxidized."},
{category:"Comprehension",question:"Why is base mixed water called electrolytic conductor?",answer:"Pure water H₂O is made of two H and one O. But electrolysis of pure water is not possible. If some base is mixed with it, then that base ionizes in the water. The water conducts electricity because of the presence of base ions."},
{category:"Comprehension",question:"Why is electrode important in electrolysis?",answer:"Two metal plates are required to run electricity through a liquid solution. These are called electrodes. The task of electrodes is to conduct a chemical reaction when electron enters the solution through one electrode and another electrode accepts electron."},
{category:"Comprehension",question:"Why is anode called oxidation electrode?",answer:"Among the ions present in the electrolytic cell, the one with the highest oxidation potential is attracted by anode and completes oxidation by losing electron. So, anode is called oxidation electrode."},
{category:"Comprehension",question:"Galvanic cell reaction is a spontaneous reaction — explain.",answer:"Chemical energy transforms into electrical energy in a galvanic cell. Zn metal donates electron and becomes Zn²⁺ ion during oxidation in anode: Zn → Zn²⁺ + 2e⁻. Copper ion in the cathode accepts the electron and completes reduction: Cu²⁺ + 2e⁻ → Cu. So electron flow is spontaneous."},
{category:"Comprehension",question:"Why is a salt bridge used in a galvanic cell? [J.B. 25; J.B. 20; D.B. 17]",answer:"A salt bridge is used for two reasons: i. It establishes a connection between the solutions of the two half-cells, completing the electrical circuit. ii. It maintains the electrical neutrality of the solutions in both half-cells."},
{category:"Comprehension",question:"Why is MnO₂ used in a dry cell? [R.B. 25; J.B. 17]",answer:"MnO₂ located at the cathode accepts the electrons produced at the anode and undergoes reduction. This keeps the flow of electrons active, which produces electricity."},
{category:"Comprehension",question:"Electricity is produced through oxidation-reduction reaction — explain.",answer:"Electron flow is the flow of electricity. In Daniell cell, Zn rod oxidizes by donating electron and Cu²⁺ reduces by accepting electron. This is how electricity is produced using oxidation-reduction."},
{category:"Comprehension",question:"Explain the structure of a dry cell.",answer:"Dry cell is made of cathode and anode. Jar made of zinc is used as the anode. The jar is filled with a mixture: MnO₂, NH₄Cl, ZnCl₂ and water. A carbon rod made of a heavy coat of MnO₂ is used as the cathode."},
{category:"Comprehension",question:"What do you mean by one faraday?",answer:"The amount of electric charge required for 1 mole electron flow is called faraday. 1.0F = 96500 C charge."},
{category:"Comprehension",question:"Write two characteristics of radioactivity.",answer:"i. Only elements with atomic number higher than 82 show radioactivity. ii. Radioactivity is a nuclear event."},
{category:"Comprehension",question:"Radioactivity is a nuclear fission reaction — explain. [D.B. 16]",answer:"When a radioactive element is struck by a high energy neutron particle it breaks into a nucleus of a new element. This is how a large nucleus breaks into smaller elements, following the condition of the fission reaction."}

/* ---------- CHEMISTRY CH 7 — SQ ---------- */
const chem7SQ=[
{category:"Knowledge",question:"What are reactants?",answer:"The starting substances that participate in a chemical reaction and are converted into products are called reactants."},
{category:"Knowledge",question:"What are irreversible reactions?",answer:"Reactions in which reactants are converted into products, but the products cannot react back to reform the reactants under the given conditions, are called irreversible reactions."},
{category:"Knowledge",question:"What are reversible reactions?",answer:"Reactions in which reactants form products and products simultaneously react to reform the original reactants are called reversible reactions."},
{category:"Knowledge",question:"What are forward and backward reactions?",answer:"The reaction converting reactants into products is the forward reaction; the reaction converting products back into reactants is the backward reaction."},
{category:"Knowledge",question:"What is an exothermic reaction?",answer:"A chemical reaction in which heat energy is released to the surroundings (ΔH is negative) is called an exothermic reaction."},
{category:"Knowledge",question:"What is an endothermic reaction?",answer:"A chemical reaction in which heat energy is absorbed from the surroundings (ΔH is positive) is called an endothermic reaction."},
{category:"Knowledge",question:"What is a redox reaction?",answer:"A chemical reaction involving the transfer of electrons from one reactant species to another is called a redox (reduction-oxidation) reaction."},
{category:"Knowledge",question:"What is an oxidation reaction?",answer:"The chemical process in which an atom, ion, or molecule loses one or more electrons, resulting in an increase in oxidation state, is called oxidation."},
{category:"Knowledge",question:"What is a reduction reaction?",answer:"The chemical process in which an atom, ion, or molecule gains one or more electrons, resulting in a decrease in oxidation state, is called reduction."},
{category:"Knowledge",question:"What is a reductant?",answer:"The chemical species that donates electrons and itself undergoes oxidation during a redox reaction is called a reductant."},
{category:"Knowledge",question:"What is an oxidant?",answer:"The chemical species that accepts electrons and itself undergoes reduction during a redox reaction is called an oxidant."},
{category:"Knowledge",question:"What is a hydrolysis reaction?",answer:"A reaction in which water reacts with a compound causing breaking of bonds and forming new compounds is called hydrolysis."},
{category:"Knowledge",question:"What is a hydration reaction?",answer:"A reaction in which one or more water molecules associate with an ionic compound to form a crystal lattice structure without breaking water chemical bonds is called hydration."},
{category:"Knowledge",question:"What is a synthesis reaction?",answer:"A chemical reaction in which two or more elements combine directly to form a single compound is called a synthesis reaction."},
{category:"Knowledge",question:"What is an isomerization reaction?",answer:"A reaction in which atoms within a molecule are rearranged to convert one structural isomer into another without changing the molecular formula."},
{category:"Knowledge",question:"What is a precipitation reaction?",answer:"A reaction occurring in aqueous solution where two soluble ionic compounds combine to produce an insoluble solid precipitate."},
{category:"Knowledge",question:"What is the chemical formula of rust?",answer:"The chemical formula of rust is hydrated ferric oxide, Fe₂O₃·nH₂O."},
{category:"Knowledge",question:"What is the rate of reaction?",answer:"The change in concentration of reactants or products per unit time is called the rate of reaction (Unit: mol L⁻¹·s⁻¹)."},
{category:"Knowledge",question:"What is a catalyst?",answer:"A substance that alters the rate of a chemical reaction without undergoing any permanent chemical change itself is called a catalyst."},
{category:"Knowledge",question:"What is Le Chatelier's Principle?",answer:"If a system at chemical equilibrium is subjected to a change in temperature, pressure, or concentration, the position of equilibrium will shift in a direction that tends to counteract that change."},
{category:"Comprehension",question:"What is meant by a non-redox reaction? Explain with a reaction.",answer:"A non-redox reaction is a chemical reaction in which no transfer of electrons takes place between reactants. The oxidation numbers of all participating atoms/ions remain unchanged.\n\nExample: NaOH + HCl → NaCl + H₂O — Na (+1), O (−2), H (+1), Cl (−1) remain constant."},
{category:"Comprehension",question:"What are spectator ions? Explain with an example.",answer:"Spectator ions are ions in an aqueous reaction mixture that do not participate directly in the chemical transformation.\n\nExample: In H⁺ + Cl⁻ + Na⁺ + OH⁻ → Na⁺ + Cl⁻ + H₂O, Na⁺ and Cl⁻ are spectator ions."},
{category:"Comprehension",question:"Determine the oxidation numbers of the central atoms in K₂Cr₂O₇ and Na₂CO₃.",answer:"K₂Cr₂O₇: 2(+1) + 2x + 7(−2) = 0 → 2x = +12 → x = +6. Cr is +6.\n\nNa₂CO₃: 2(+1) + y + 3(−2) = 0 → y = +4. C is +4."},
{category:"Comprehension",question:"Explain why Hydrolysis and Hydration reactions are not the same.",answer:"Hydrolysis involves the chemical reaction of water with a substance, breaking water's covalent H−OH bonds to form new compounds (e.g., SiCl₄ + 4H₂O → Si(OH)₄ + 4HCl).\n\nHydration is a physical-chemical association where whole water molecules lock into the crystal lattice without breaking chemical bonds (e.g., CuSO₄ + 5H₂O → CuSO₄·5H₂O)."},
{category:"Comprehension",question:"Why is chemical equilibrium called dynamic in nature?",answer:"Chemical equilibrium appears static because macroscopic properties stop changing. However, at the molecular level, both forward and backward reactions continue simultaneously at equal rates. So chemical equilibrium is dynamic, not static."},
{category:"Comprehension",question:"Why is the heat of neutralization of a strong acid and strong base always constant (−57.34 kJ/mol)?",answer:"Strong acids and bases ionize completely. The cations of the base and anions of the acid remain as spectator ions. The actual reaction is strictly H⁺ + OH⁻ → H₂O with ΔH = −57.34 kJ/mol."},
{category:"Comprehension",question:"Explain why Fe²⁺ ion can act as both an oxidizing and a reducing agent.",answer:"Fe²⁺ is at an intermediate oxidation state (+2). It can donate an electron to reach +3 (Fe²⁺ → Fe³⁺ + e⁻, acting as reductant), or accept electrons to reach metallic iron (Fe²⁺ + 2e⁻ → Fe, acting as oxidant)."},
{category:"Comprehension",question:"Why is rusting of iron classified as a redox process?",answer:"Oxidation: Fe(s) → Fe²⁺ + 2e⁻.\nReduction: O₂ + 2H₂O + 4e⁻ → 4OH⁻.\nThe Fe²⁺ and OH⁻ combine to form hydrated iron(III) oxide. Electron donation and acceptance occur simultaneously, so rusting is a redox process."},
{category:"Comprehension",question:"Why is the reaction between ammonium cyanate and urea called an isomerization reaction?",answer:"NH₄CNO →Δ→ NH₂−CO−NH₂. Both compounds share the same molecular formula (CH₄N₂O) but have different structural arrangements."},
{category:"Comprehension",question:"How can a reversible reaction be converted into an irreversible reaction?",answer:"By removing one of the products as fast as it forms: (1) Open Vessel System — if a gas escapes; (2) Precipitation — removing an ion by forming an insoluble precipitate; (3) Chemical Removal — neutralizing or tying up a product."}
];

const phy8SQ=[
{category:"Knowledge",question:"What type of wave is light?",answer:"Light is an electromagnetic wave."},
{category:"Knowledge",question:"Range of wavelength of visible light?",answer:"4 × 10⁻⁷ m to 7 × 10⁻⁷ m (400 nm to 700 nm)."},
{category:"Knowledge",question:"State the 1st law of reflection.",answer:"The incident ray, the reflected ray, and the normal drawn at the point of incidence all lie in the same plane."},
{category:"Knowledge",question:"How many conditions are required for total internal reflection?",answer:"Two conditions."},
{category:"Knowledge",question:"Write down the 2 laws of reflection.",answer:"1st Law: The incident ray, reflected ray, and normal lie in the same plane.\n2nd Law: The angle of reflection equals the angle of incidence (∠i = ∠r)."},
{category:"Knowledge",question:"What is the surface from where light rays return back?",answer:"The reflecting surface."},
{category:"Knowledge",question:"What is reflection of light?",answer:"When a ray of light travelling through one medium falls on the boundary of another and a portion returns to the first medium."},
{category:"Knowledge",question:"What is a mirror?",answer:"A smooth surface on which regular reflection of light occurs."},
{category:"Knowledge",question:"What is silvering?",answer:"The process of applying a thin coating of silver or mercury on one surface of glass to make a reflecting mirror."},
{category:"Knowledge",question:"What is a real image?",answer:"If light rays from a point, after reflection or refraction, actually meet at a second point, that second point is called the real image."},
{category:"Knowledge",question:"What is the principal focus of a spherical mirror?",answer:"When parallel rays strike a spherical mirror and after reflection either converge at a point (concave) or appear to diverge from a point (convex) on the principal axis, that point is called the principal focus."},
{category:"Knowledge",question:"What is focal length?",answer:"The distance between the pole and the principal focus of a mirror."},
{category:"Knowledge",question:"What is the center of curvature?",answer:"The center of the hollow sphere of which the spherical mirror forms a part."},
{category:"Knowledge",question:"Define the principal axis of a mirror.",answer:"The straight line passing through the pole and the center of curvature of a spherical mirror."},
{category:"Knowledge",question:"Relation between focal length and radius of curvature?",answer:"f = R/2."},
{category:"Knowledge",question:"What is linear magnification?",answer:"The ratio of the length of the image to the length of the object (m = L'/L)."},
{category:"Knowledge",question:"What type of mirror is used in rearview and side-view mirrors of a car?",answer:"Convex mirrors."},
{category:"Knowledge",question:"In dentistry, what type of mirrors are used?",answer:"Concave mirrors."},
{category:"Comprehension",question:"Explain why the focal length of a plane mirror is infinite.",answer:"The reflecting surface of a plane mirror is perfectly flat (zero curvature, R = ∞). Since f = R/2, f = ∞. Also, parallel rays remain parallel after reflection — they never converge or diverge to a point."},
{category:"Comprehension",question:"What do you mean by regular and irregular reflection?",answer:"Regular reflection: parallel rays strike a smooth surface and remain parallel (or converge/diverge as a beam) after reflection.\n\nIrregular (Diffused) reflection: parallel rays strike a rough surface and after reflection spread out in different directions."},
{category:"Comprehension",question:"Explain why a convex mirror always forms a diminished virtual image.",answer:"A convex mirror diverges the falling rays. Reflected rays spread out and never intersect in front of the mirror. Extended backward, they appear to meet between P and F, producing a small, virtual, erect image."},
{category:"Comprehension",question:"Why is a concave mirror used in the searchlight of a launch?",answer:"A bulb placed at the focus of a concave mirror produces a parallel beam after reflection — this beam travels far without spreading."},
{category:"Comprehension",question:"Differences between a real image and a virtual image.",answer:"1. Orientation: Virtual images are always erect; real images are always inverted.\n\n2. Image Distance: v is negative for virtual images, positive for real images.\n\n3. Projection: Virtual images cannot be projected on a screen; real images can be."},
{category:"Comprehension",question:"Explain how to prevent lateral displacement in a plane mirror.",answer:"Use two plane mirrors arranged at 90° to each other. Double reflection reverses left-right orientation back to the original."},
{category:"Comprehension",question:"Why does a green leaf of a tree look black under blue light? [J.B. 25]",answer:"Chlorophyll absorbs blue light completely and has no green light to reflect. So no light reaches our eyes — the leaf appears black."},
{category:"Comprehension",question:"Why is a plane mirror used in a dressing table?",answer:"A plane mirror produces a virtual, erect image of the same size as the object, at equal distance behind the mirror — a perfect full-scale view."},
{category:"Comprehension",question:"Why do dentists use concave mirrors?",answer:"When the tooth lies within the focal length of a concave mirror, it forms an erect, highly magnified virtual image behind the mirror — allowing detailed inspection."},
{category:"Comprehension",question:"Why is a convex mirror used as a side-view mirror in a car?",answer:"A convex mirror always produces an erect, diminished virtual image, giving a much wider field of view than a plane mirror of the same size."},
{category:"Comprehension",question:"Why is the angle of reflection zero when a ray is incident perpendicularly?",answer:"When a ray falls normally, the angle of incidence with the normal is 0°. By the second law of reflection, r = i = 0°, so the ray retraces its path."},
{category:"Comprehension",question:"What colour will a yellow flower appear when seen through red sunglasses?",answer:"A yellow flower reflects red and green light. Red sunglasses transmit only red light. Since the flower reflects red, it appears bright red."},
{category:"Comprehension",question:"Briefly explain the nature of light.",answer:"Light is a form of energy that propagates as electromagnetic waves. It exhibits dual nature — as a wave and as particles (photons). In vacuum, light travels at 3 × 10⁸ m/s in straight lines."},
{category:"Comprehension",question:"Why is the lateral inversion of the letter 'M' not noticeable in a plane mirror?",answer:"'M' has vertical axis symmetry — the left half is a mirror image of the right half. So even though lateral inversion occurs, the resulting image looks the same."},
{category:"Comprehension",question:"Why can't a real image be formed using a convex mirror?",answer:"The reflected rays diverge and never physically meet in front of the mirror. Since actual intersection is required for a real image, a convex mirror can only form virtual images."},
{category:"Comprehension",question:"Why can there be only one principal axis in a spherical mirror?",answer:"The principal axis passes through two fixed points — pole (P) and center of curvature (C). Two points uniquely define one straight line."},
{category:"Comprehension",question:"How can you identify a mirror or lens without touching it?",answer:"Convex lens or concave mirror: forms an upright, magnified image (object within focus).\nConcave lens or convex mirror: always forms an upright, diminished image.\nPlane mirror: forms an upright image of exactly the same size."}

{category:"Waves",question:"Distinguish between transverse and longitudinal waves.",answer:"Transverse wave: particle vibration is perpendicular to the direction of wave propagation (e.g., light, water waves). Longitudinal wave: particle vibration is parallel to the direction of propagation (e.g., sound waves)."},

<article class="note"><h3>2 · Reflection &amp; Laws</h3>
<p>When light bounces off a boundary back into the first medium, it is <span class="term">reflection</span>.</p>

<article class="note"><h3>3 · Mirror Basics</h3>
<p><span class="term">Silvering:</span> coating one side of glass with silver/mercury.</p>
<p><strong>Plane mirror image:</strong> virtual, erect, same size, at equal distance behind mirror, laterally inverted.</p></article>
<article class="note"><h3>4 · Spherical Mirrors</h3>
<ul><li><strong>Pole (P):</strong> midpoint of reflecting surface.</li><li><strong>Center of curvature (C):</strong> center of the sphere.</li><li><strong>Radius of curvature (r):</strong> distance from C to P.</li><li><strong>Principal axis:</strong> line through P and C.</li><li><strong>Principal focus (F):</strong> where parallel rays converge or appear to diverge.</li><li><strong>Focal length:</strong> f = r / 2.</li></ul>
<p><strong>Concave = converging; Convex = diverging.</strong></p></article>
<article class="note"><h3>5 · Image Formation (Concave)</h3>
<table><thead><tr><th>Object</th><th>Image</th></tr></thead><tbody>
<tr><td>At ∞</td><td>At F, real, inverted, tiny</td></tr>
<tr><td>Beyond C</td><td>Between F and C, real, inverted, smaller</td></tr>
<tr><td>At C</td><td>At C, real, inverted, same size</td></tr>
<tr><td>Between C and F</td><td>Beyond C, real, inverted, magnified</td></tr>
<tr><td>At F</td><td>At infinity</td></tr>
<tr><td>Between P and F</td><td>Behind mirror, virtual, erect, magnified</td></tr>
</tbody></table>
<p>Convex mirror: always virtual, erect, diminished.</p></article>
<article class="note"><h3>6 · Magnification &amp; Formulas</h3>
<div class="formula">1/f = 1/u + 1/v · m = −v/u</div>
<table><thead><tr><th></th><th>Concave</th><th>Convex</th></tr></thead><tbody>
<tr><td>u (object)</td><td>+</td><td>+</td></tr>
<tr><td>v (image)</td><td>+ if real, − if virtual</td><td>−</td></tr>
<tr><td>f (focal length)</td><td>−</td><td>+</td></tr>

const pomo=document.getElementById("pomo");
const pomoMode=document.getElementById("pomoMode");
const pomoTime=document.getElementById("pomoTime");
const pomoStart=document.getElementById("pomoStart");
const pomoReset=document.getElementById("pomoReset");
const pomoSelect=document.getElementById("pomoSelect");
const BREAK_MAP={"15":2,"25":5,"50":10};
const WARN=30;
const PS={mode:"focus",running:false,remaining:25*60,total:25*60,intervalId:null,warnFired:false};

function focusSec(){return (parseInt(pomoSelect.value,10)||25)*60;}
function breakSec(){const m=parseInt(pomoSelect.value,10)||25;return (BREAK_MAP[String(m)]||5)*60;}

function updPomo(){
  const s=PS.remaining;
  pomoTime.textContent=`${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
  pomoMode.textContent=PS.mode==="focus"?"Focus":"Break";
  pomo.classList.toggle("running",PS.running&&PS.mode==="focus");
  pomo.classList.toggle("break-mode",PS.mode==="break");
  const warn=PS.running&&PS.remaining<=WARN&&PS.remaining>0;
  pomo.classList.toggle("warning",warn);
  pomoStart.textContent=PS.running?"Pause":(PS.remaining===PS.total?"Start":"Resume");
}

function startInterval(){
  if(PS.intervalId)clearInterval(PS.intervalId);
  PS.intervalId=setInterval(()=>{
    if(!PS.running)return;
    PS.remaining--;
    if(PS.remaining===WARN&&!PS.warnFired){PS.warnFired=true;playWarning();}
    if(PS.remaining<=0){
      if(PS.mode==="focus"){
        PS.mode="break";PS.total=breakSec();PS.remaining=PS.total;PS.warnFired=false;playChime();
      }else{
        PS.mode="focus";PS.total=focusSec();PS.remaining=PS.total;
        PS.running=false;PS.warnFired=false;playBreakEnd();
        clearInterval(PS.intervalId);PS.intervalId=null;
      }
    }
    updPomo();
  },1000);
}

pomoStart.addEventListener("click",()=>{
  ensureAudio();
  if(PS.remaining<=0){PS.mode="focus";PS.total=focusSec();PS.remaining=PS.total;PS.warnFired=false;}
  PS.running=!PS.running;
  if(PS.running){
    startInterval();
    try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();}catch(e){}
  }else if(PS.intervalId){clearInterval(PS.intervalId);PS.intervalId=null;}
  updPomo();
});

pomoReset.addEventListener("click",()=>{
  PS.running=false;PS.mode="focus";PS.total=focusSec();PS.remaining=PS.total;PS.warnFired=false;
  if(PS.intervalId){clearInterval(PS.intervalId);PS.intervalId=null;}
  updPomo();
});

pomoSelect.addEventListener("change",()=>{
  if(PS.running){PS.running=false;if(PS.intervalId){clearInterval(PS.intervalId);PS.intervalId=null;}}
  PS.mode="focus";PS.total=focusSec();PS.remaining=PS.total;PS.warnFired=false;
  updPomo();
});

PS.total=focusSec();PS.remaining=PS.total;updPomo();


/* ============================================================
   JS § 5. HELPERS
   ============================================================ */
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}


/* ============================================================
   JS § 6. NAVIGATION — step switching
   ============================================================ */
let curSubject=null,curChapter=null;

const stepSubject=document.getElementById("stepSubject");
const stepChapter=document.getElementById("stepChapter");
const stepStudy=document.getElementById("stepStudy");
const subjectList=document.getElementById("subjectList");
const chapterList=document.getElementById("chapterList");
const chapterSubject=document.getElementById("chapterSubject");
const studyBody=document.getElementById("studyBody");

function showStep(step){
  stepSubject.classList.toggle("hidden",step!=="subject");
  stepChapter.classList.toggle("hidden",step!=="chapter");
  stepStudy.classList.toggle("hidden",step!=="study");
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSubjects(){
  subjectList.innerHTML="";
  SUBJECTS.forEach(subj=>{
    const btn=document.createElement("button");
    btn.className="card-btn";
    btn.type="button";
    const n=subj.chapters.length;
    btn.innerHTML=`
      <span class="card-emoji">${subj.icon}</span>
      <h3 class="card-title">${subj.name}</h3>
      <div class="card-meta">${n} chapter${n>1?"s":""} · ${subj.tagline}</div>
    `;
    btn.addEventListener("click",()=>{curSubject=subj.id;renderChapters();showStep("chapter");});
    subjectList.appendChild(btn);
  });
}

function renderChapters(){
  const subj=SUBJECTS.find(s=>s.id===curSubject);
  if(!subj)return;
  chapterSubject.textContent=subj.name;
  chapterList.innerHTML="";
  subj.chapters.forEach(cid=>{
    const ch=REGISTRY[cid];if(!ch)return;
    const btn=document.createElement("button");
    btn.className="card-btn";
    btn.type="button";
    btn.innerHTML=`
      <div class="card-num">Chapter ${ch.chapterNum}</div>
      <h3 class="card-title">${ch.title}</h3>
      <p class="card-desc">${ch.desc}</p>
      <div class="card-stats">
        <span>📝 ${ch.mcq.length} MCQs</span>
        <span>📖 ${ch.sq.length} SQs</span>
      </div>
    `;
    btn.addEventListener("click",()=>openChapter(cid));
    chapterList.appendChild(btn);
  });
}

document.getElementById("backToSubjects").addEventListener("click",()=>showStep("subject"));
document.getElementById("brand").addEventListener("click",()=>showStep("subject"));
document.getElementById("switchSubject").addEventListener("click",()=>showStep("subject"));
document.getElementById("switchChapter").addEventListener("click",()=>{renderChapters();showStep("chapter");});


/* ============================================================
   JS § 7. RENDERERS — chapter view, MCQ, SQ
   ============================================================ */
function openChapter(cid){
  const ch=REGISTRY[cid];if(!ch)return;
  curChapter=cid;
  document.getElementById("crumbSubject").textContent=ch.subjectLabel;
  document.getElementById("crumbChapter").textContent=`Chapter ${ch.chapterNum} · ${ch.title}`;
  document.getElementById("crumbSubject").onclick=()=>{curSubject=ch.subject;renderChapters();showStep("chapter");};

  studyBody.innerHTML=`
    <div class="tabs">
      <button class="tab" data-tab="notes">Notes</button>
      <button class="tab active" data-tab="mcq">MCQ</button>
      <button class="tab" data-tab="sq">Short Questions</button>
    </div>
    <div id="viewNotes" class="hidden"></div>
    <div id="viewMCQ"></div>
    <div id="viewSQ" class="hidden"></div>
  `;
  document.getElementById("viewNotes").innerHTML=ch.notesHTML||"<p>No notes.</p>";

  const tabs=studyBody.querySelectorAll(".tab");
  const views={
    notes:document.getElementById("viewNotes"),
    mcq:document.getElementById("viewMCQ"),
    sq:document.getElementById("viewSQ")
  };
  tabs.forEach(t=>t.addEventListener("click",()=>{
    tabs.forEach(x=>x.classList.toggle("active",x===t));
    const k=t.dataset.tab;
    Object.keys(views).forEach(key=>views[key].classList.toggle("hidden",key!==k));
    window.scrollTo({top:0,behavior:"smooth"});
  }));

  renderMCQ(views.mcq,ch);
  renderSQ(views.sq,ch);
  showStep("study");
}

/* ---------- MCQ renderer ---------- */
function renderMCQ(root,ch){
  const cats=["All topics",...new Set(ch.mcq.map(q=>q.category))];
  root.innerHTML=`
    <div class="filters">
      ${cats.map((c,i)=>`<button class="pill${i===0?" on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
      <span class="spacer"></span>
      <button class="shuffle" id="shuffleBtn" type="button">🔄 Shuffle</button>
    </div>
    <div class="study-card">
      <div class="study-top">
        <span id="qProgress">Question 1 / ${ch.mcq.length}</span>
        <span class="cat" id="qCat">—</span>
      </div>
      <div class="bar"><div class="bar-fill" id="qBar"></div></div>
      <h2 class="question" id="qText"></h2>
      <div class="opts" id="qOpts"></div>
      <div class="fb" id="qFb"></div>
      <div class="actions">
        <span class="hint" id="qHint">Press 1–4 to pick · Enter to submit · ← → to navigate</span>
        <div class="actions-right">
          <button class="btn ghost" id="prevBtn" disabled>← Previous</button>
          <button class="btn accent" id="checkBtn" disabled>Check</button>
        </div>
      </div>
    </div>
    <div id="qResults" class="hidden"></div>
  `;

  const state={
    filter:"All topics",
    list:[...ch.mcq],
    idx:0,sel:null,checked:false,
    correct:0,answered:0,missed:[],answerMap:{}
  };

  const qCat=document.getElementById("qCat");
  const qProgress=document.getElementById("qProgress");
  const qBar=document.getElementById("qBar");
  const qText=document.getElementById("qText");
  const qOpts=document.getElementById("qOpts");
  const qFb=document.getElementById("qFb");
  const checkBtn=document.getElementById("checkBtn");
  const prevBtn=document.getElementById("prevBtn");
  const qResults=document.getElementById("qResults");
  const shuffleBtn=document.getElementById("shuffleBtn");

  function render(){
    if(state.idx>=state.list.length)return showResults();
    const q=state.list[state.idx];
    const saved=state.answerMap[state.idx];
    state.sel=saved!==undefined?saved:null;
    state.checked=saved!==undefined;
    qCat.textContent=q.category;
    qProgress.textContent=`Question ${state.idx+1} / ${state.list.length}`;
    qBar.style.width=`${(state.idx/state.list.length)*100}%`;
    qText.textContent=q.question;
    qFb.className="fb"; qFb.innerHTML="";
    qOpts.innerHTML="";
    q.options.forEach((opt,i)=>{
      const b=document.createElement("button");
      b.className="opt"; b.type="button";
      b.innerHTML=`<span class="lt">${String.fromCharCode(65+i)}</span><span>${esc(opt)}</span>`;
      if(state.checked){
        b.disabled=true;
        if(i===q.answer)b.classList.add("right");
        if(i===state.sel&&state.sel!==q.answer)b.classList.add("wrong");
      }else if(state.sel===i){
        b.classList.add("sel");
      }
      b.addEventListener("click",()=>{
        if(state.checked)return;
        state.sel=i;
        [...qOpts.children].forEach((o,k)=>o.classList.toggle("sel",k===i));
        checkBtn.disabled=false;
      });
      qOpts.appendChild(b);
    });
    if(state.checked){
      const ok=state.sel===q.answer;
      qFb.className=`fb show ${ok?"good":"bad"}`;
      qFb.innerHTML=`<strong>${ok?"Correct":"Not quite"}</strong>${esc(q.explanation)}`;
      checkBtn.textContent=state.idx===state.list.length-1?"See results":"Next";
    }else{
      checkBtn.textContent="Check";
    }
    checkBtn.disabled=!state.checked&&state.sel===null;
    prevBtn.disabled=state.idx===0;
  }

  function check(){
    if(state.sel===null)return;
    const q=state.list[state.idx];
    if(!state.checked){
      state.checked=true;state.answered++;
      state.answerMap[state.idx]=state.sel;
      const ok=state.sel===q.answer;
      if(ok)state.correct++;
      else state.missed.push({q:q.question,correct:q.options[q.answer],chosen:q.options[state.sel]});
      render();
    }else{
      state.idx++;render();
    }
  }

  function prev(){if(state.idx===0)return;state.idx--;render();}

  function showResults(){
    const pct=state.list.length?Math.round((state.correct/state.list.length)*100):0;
    document.querySelector("#viewMCQ .study-card").style.display="none";
    document.querySelector("#viewMCQ .filters").style.display="none";
    qResults.className="results";
    qResults.innerHTML=`
      <p class="big"><span>${pct}%</span></p>
      <p class="sub">${state.correct} of ${state.list.length} correct</p>
      <div class="row">
        <button class="btn accent" id="retryBtn">Try again</button>
        ${state.missed.length?`<button class="btn ghost" id="reviewBtn">Review missed (${state.missed.length})</button>`:""}
      </div>
      ${state.missed.length?`<div class="missed"><h4>Missed questions</h4>${state.missed.map(m=>`<div class="missed-item"><strong>${esc(m.q)}</strong><span>Yours: ${esc(m.chosen)} · Correct: ${esc(m.correct)}</span></div>`).join("")}</div>`:""}
    `;
    document.getElementById("retryBtn").addEventListener("click",()=>start(state.filter));
    const rv=document.getElementById("reviewBtn");
    if(rv)rv.addEventListener("click",()=>{
      state.list=state.list.filter(q=>state.missed.some(m=>m.q===q.question));
      state.idx=0;state.sel=null;state.checked=false;state.correct=0;state.answered=0;state.missed=[];state.answerMap={};
      qResults.className="hidden";
      document.querySelector("#viewMCQ .study-card").style.display="";
      document.querySelector("#viewMCQ .filters").style.display="";
      render();
    });
  }

  function start(filter){
    state.filter=filter;
    state.list=filter==="All topics"?[...ch.mcq]:ch.mcq.filter(q=>q.category===filter);
    state.idx=0;state.sel=null;state.checked=false;state.correct=0;state.answered=0;state.missed=[];state.answerMap={};
    qResults.className="hidden";
    document.querySelector("#viewMCQ .study-card").style.display="";
    document.querySelector("#viewMCQ .filters").style.display="";
    root.querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",b.dataset.cat===filter));
    render();
  }

  root.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>start(b.dataset.cat)));
  checkBtn.addEventListener("click",check);
  prevBtn.addEventListener("click",prev);
  shuffleBtn.addEventListener("click",()=>{
    state.list=shuffle(state.list);
    state.idx=0;state.sel=null;state.checked=false;state.correct=0;state.answered=0;state.missed=[];state.answerMap={};
    qResults.className="hidden";
    document.querySelector("#viewMCQ .study-card").style.display="";
    document.querySelector("#viewMCQ .filters").style.display="";
    render();
  });

  document.addEventListener("keydown",e=>{
    if(!stepStudy.classList.contains("hidden")&&!document.getElementById("viewMCQ").classList.contains("hidden")){
      if(["1","2","3","4"].includes(e.key)&&!state.checked){
        const i=Number(e.key)-1;
        const btn=qOpts.children[i];
        if(btn)btn.click();
      }
      if(e.key==="Enter"&&!checkBtn.disabled)checkBtn.click();
      if(e.key==="ArrowLeft"&&!prevBtn.disabled)prevBtn.click();
    }
  });

  render();
}

/* ---------- SQ renderer ---------- */
function renderSQ(root,ch){
  root.innerHTML=`
    <div class="study-card">
      <div class="study-top">
        <span id="sqProgress">Question 1 / ${ch.sq.length}</span>
        <span class="cat" id="sqCat">—</span>
      </div>
      <div class="bar"><div class="bar-fill" id="sqBar"></div></div>
      <h2 class="question" id="sqText"></h2>
      <div class="sq-answer" id="sqAnswer"></div>
      <div class="actions">
        <span class="hint">← → to navigate</span>
        <div class="actions-right">
          <button class="btn ghost" id="sqPrev" disabled>← Previous</button>
          <button class="btn accent" id="sqShow">Show answer</button>
          <button class="btn" id="sqNext">Next →</button>
        </div>
      </div>
    </div>
  `;
  let idx=0,revealed=false;
  const sqCat=document.getElementById("sqCat");
  const sqProgress=document.getElementById("sqProgress");
  const sqBar=document.getElementById("sqBar");
  const sqText=document.getElementById("sqText");
  const sqAnswer=document.getElementById("sqAnswer");
  const sqShow=document.getElementById("sqShow");
  const sqNext=document.getElementById("sqNext");
  const sqPrev=document.getElementById("sqPrev");

  function render(){
    const sq=ch.sq[idx];
    sqCat.textContent=sq.category;
    sqProgress.textContent=`Question ${idx+1} / ${ch.sq.length}`;
    sqBar.style.width=`${((idx+1)/ch.sq.length)*100}%`;
    sqText.textContent=sq.question;
    sqAnswer.textContent=sq.answer;
    sqAnswer.classList.remove("show");
    revealed=false;
    sqShow.textContent="Show answer";
    sqPrev.disabled=idx===0;
  }

  sqShow.addEventListener("click",()=>{
    revealed=!revealed;
    sqAnswer.classList.toggle("show",revealed);
    sqShow.textContent=revealed?"Hide answer":"Show answer";
  });
  sqNext.addEventListener("click",()=>{idx=(idx+1)%ch.sq.length;render();});
  sqPrev.addEventListener("click",()=>{if(idx>0){idx--;render();}});
  document.addEventListener("keydown",e=>{
    if(!stepStudy.classList.contains("hidden")&&!document.getElementById("viewSQ").classList.contains("hidden")){
      if(e.key==="ArrowLeft"&&!sqPrev.disabled)sqPrev.click();
      if(e.key==="ArrowRight")sqNext.click();
    }
  });
  render();
}


/* ============================================================
   JS § 8. INIT
   ============================================================ */
renderSubjects();
showStep("subject");
</script>
